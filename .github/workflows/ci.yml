name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    continue-on-error: false
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        env:
          NODE_ENV: development
        run: |
          set -e
          echo "Environment: NODE_ENV=$NODE_ENV"
          echo "Checking npm and node versions:"
          npm --version
          node --version
          echo "Installing frontend dependencies..."
          npm install --no-audit --no-fund
          echo "Checking node_modules structure:"
          ls -la node_modules 2>&1 | head -10
          echo "Checking if node_modules/.bin exists:"
          test -d node_modules/.bin && echo "node_modules/.bin exists" || echo "node_modules/.bin MISSING!"
          echo "Listing all binaries in node_modules/.bin:"
          ls -la node_modules/.bin/ 2>&1 | head -20 || echo "Cannot list node_modules/.bin"
          echo "Checking for eslint:"
          find node_modules -name "eslint" -type f 2>/dev/null | head -5 || echo "No eslint executable found"
          echo "Checking eslint package:"
          test -d node_modules/eslint && echo "eslint package directory exists" || echo "eslint package MISSING"
          echo "Checking eslint binary explicitly:"
          if [ -f node_modules/.bin/eslint ] || [ -L node_modules/.bin/eslint ]; then
            echo "ESLint binary found!"
            ls -la node_modules/.bin/eslint
          else
            echo "ERROR: ESLint binary is missing!"
            echo "Attempting to rebuild binaries..."
            npm rebuild || true
            echo "Checking again after rebuild:"
            ls -la node_modules/.bin/eslint 2>&1 || echo "Still missing after rebuild"
            echo "Trying explicit reinstall..."
            npm install eslint@^8.54.0 --save-dev --no-audit --no-fund
            echo "Checking package.json bin field:"
            cat node_modules/eslint/package.json | grep -A 5 '"bin"' || echo "No bin field found"
            echo "Final check:"
            ls -la node_modules/.bin/eslint 2>&1 || (echo "ESLint binary STILL missing! This is a critical error." && exit 1)
          fi
          echo "Testing eslint binary:"
          node_modules/.bin/eslint --version
          echo "ESLint verified successfully"
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          echo "Installing backend dependencies..."
          npm ci --no-audit
      
      - name: Lint frontend
        working-directory: ./frontend
        run: |
          echo "Current PATH: $PATH"
          echo "Checking eslint location:"
          which eslint || echo "eslint not in PATH"
          ./node_modules/.bin/eslint --version || echo "Direct path failed"
          echo "Running npm run lint:"
          npm run lint
      
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test123@localhost:5432/taskmanager_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
        run: npm test

