name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    continue-on-error: false
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        env:
          NODE_ENV: development
        run: |
          set -e
          echo "Environment: NODE_ENV=$NODE_ENV"
          echo "Installing frontend dependencies with npm install..."
          npm install --no-audit --no-fund
          echo "Verifying installation..."
          echo "Checking if node_modules/.bin exists and listing contents:"
          ls -la node_modules/.bin/ 2>&1 | grep -E "(eslint|total)" || echo "No eslint found in listing"
          echo "Checking eslint binary explicitly:"
          if [ ! -f node_modules/.bin/eslint ] && [ ! -L node_modules/.bin/eslint ]; then
            echo "ERROR: ESLint binary is missing! Attempting to fix..."
            echo "Checking if eslint package is installed:"
            npm list eslint --depth=0 || echo "eslint not in tree"
            echo "Reinstalling eslint..."
            npm install eslint@^8.54.0 --save-dev --no-audit --no-fund --force
            echo "Verifying after reinstall:"
            ls -la node_modules/.bin/eslint || (echo "Still missing! Exiting..." && exit 1)
          fi
          echo "Testing eslint binary:"
          node_modules/.bin/eslint --version || (echo "ESLint binary failed!" && exit 1)
          echo "ESLint verified successfully"
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          echo "Installing backend dependencies..."
          npm ci --no-audit
      
      - name: Lint frontend
        working-directory: ./frontend
        run: |
          echo "Current PATH: $PATH"
          echo "Checking eslint location:"
          which eslint || echo "eslint not in PATH"
          ./node_modules/.bin/eslint --version || echo "Direct path failed"
          echo "Running npm run lint:"
          npm run lint
      
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test123@localhost:5432/taskmanager_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
        run: npm test

