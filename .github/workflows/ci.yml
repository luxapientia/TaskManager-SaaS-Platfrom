name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    continue-on-error: false
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install dependencies
        env:
          NODE_ENV: development
        run: |
          set -e
          echo "Environment: NODE_ENV=$NODE_ENV"
          echo "Installing all workspace dependencies at root..."
          npm install --no-audit --no-fund
          echo "Verifying eslint installation:"
          npm list eslint --workspace=frontend || echo "eslint not found in frontend workspace"
          echo "Verifying eslint-config-react-app:"
          npm list eslint-config-react-app --workspace=frontend || echo "eslint-config-react-app not found"
          echo "Checking eslint binary in frontend:"
          ls -la frontend/node_modules/.bin/eslint 2>&1 || echo "Not in frontend/node_modules"
          ls -la node_modules/.bin/eslint 2>&1 || echo "Not in root node_modules"
          echo "ESLint installation complete"
      
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
      
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test123@localhost:5432/taskmanager_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
        run: npm test

