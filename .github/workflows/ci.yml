name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    continue-on-error: false
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        env:
          NODE_ENV: development
        run: |
          echo "Installing dependencies..."
          npm install --no-audit --no-fund
          echo "Verifying eslint installation..."
          npm list eslint || echo "ESLint not in package tree"
          ls -la node_modules/.bin/ | grep eslint || echo "ESLint binary not found"
          # Force install eslint if not found
          if [ ! -f node_modules/.bin/eslint ]; then
            echo "ESLint binary missing, installing explicitly..."
            npm install eslint@^8.54.0 eslint-plugin-react@^7.33.2 eslint-plugin-react-hooks@^4.6.0 @typescript-eslint/eslint-plugin@^6.13.1 @typescript-eslint/parser@^6.13.1 --save-dev --no-audit --no-fund
          fi
          # Verify eslint works
          ./node_modules/.bin/eslint --version
          echo "ESLint verified successfully"
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --prefer-offline --no-audit
      
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
      
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test123@localhost:5432/taskmanager_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
        run: npm test

